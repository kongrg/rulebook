[project]
name = "rulebook"
version = "0.1.0"
description = "Cross-lingual hybrid RAG over EN/DE/FI/EL gambling regulation, with a retrieval eval that gates CI."
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pymupdf>=1.24",
    "qdrant-client>=1.12",
    "FlagEmbedding>=1.3",
    "torch>=2.4",  # listed directly so the CPU-only source below applies
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest>=8"]

# Linux (CI, Docker) gets the CPU build of torch instead of the multi-GB CUDA one.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
